<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Parking Pin" />
  <meta name="description" content="Save where you parked on iPhone or Android. Find your car later. Stays on this phone." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=17" sizes="180x180" />
  <link rel="icon" href="favicon-32.png?v=17" type="image/png" sizes="32x32" />
  <link rel="icon" href="icon.svg?v=17" type="image/svg+xml" />
  <title>Parking Pin</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #0a0a0a;
      --border: #333333;
      --text: #ffffff;
      --muted: #c8c8c8;
      --accent: #ff6a00;
      --accent-press: #e55f00;
      --on-accent: #111111;
      --danger: #ff4d4d;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.4;
    }

    body {
      padding: calc(20px + var(--safe-top)) 18px calc(28px + var(--safe-bottom));
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .logo svg { width: 26px; height: 26px; }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 14px;
      font-size: 1.05rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    input[type="text"]::placeholder { color: #8a8a8a; }
    input[type="text"]:disabled { color: #8a8a8a; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 10px;
    }

    .note-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .note-row input[type="text"] {
      flex: 1;
      width: auto;
      min-width: 0;
    }

    .cam-btn {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
    }

    .cam-btn svg { width: 26px; height: 26px; display: block; }
    .cam-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .cam-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .photo-draft {
      position: relative;
      flex-shrink: 0;
      width: 64px;
      height: 64px;
    }

    .photo-draft img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
    }

    .draft-remove {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .chip {
      -webkit-appearance: none;
      appearance: none;
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.1;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .chip:active,
    .chip.is-on {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }

    .chip.is-on:active { background: var(--accent-press); }

    .chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chip:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 64px;
      padding: 16px 20px;
      margin-top: 14px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }
    .btn-primary:active:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
    .btn-primary:disabled {
      background: #2a2a2a;
      color: #8a8a8a;
      border-color: #333333;
      opacity: 1;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-maps {
      background: var(--bg);
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-maps:active:not(:disabled) {
      background: var(--accent);
      color: var(--on-accent);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: #5c2424;
      min-height: 52px;
      font-size: 1rem;
      margin-top: 10px;
    }

    .pin-entry {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 76px;
      margin: 0 0 16px;
      padding: 16px 16px 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      text-align: left;
    }

    .entry-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      background: #000;
    }

    .pin-entry-body { flex: 1; min-width: 0; }

    .pin-entry-note {
      display: block;
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: 700;
      word-break: break-word;
    }

    .pin-entry-time {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .pin-entry-countdown {
      display: block;
      margin-top: 2px;
      font-size: 0.95rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .pin-entry-countdown.is-warn { color: #ff4d2e; }

    .pin-entry-chevron {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 1.8rem;
      line-height: 1;
      font-weight: 400;
    }

    .pin-entry:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin: 0 0 12px;
      padding: 0 2px;
      border: none;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #pin-heading {
      margin: 0 0 14px;
      font-size: 1.15rem;
    }

    .pin-meta {
      display: grid;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .meta-row:last-child { border-bottom: none; padding-bottom: 0; }

    .meta-label {
      color: var(--muted);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .meta-value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      font-variant-numeric: tabular-nums;
    }

    .coords {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .note-value { color: var(--accent); }

    .pin-photo {
      display: block;
      width: 100%;
      margin: 0 0 14px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      cursor: pointer;
    }

    .pin-photo img {
      display: block;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #000;
    }

    .map-block { margin-top: 14px; }

    .map-link {
      position: relative;
      display: block;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #111;
      text-decoration: none;
    }

    .map-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .map-stage { position: absolute; inset: 0; }

    .map-tile {
      position: absolute;
      width: 256px;
      height: 256px;
      max-width: none;
    }

    .map-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid #111;
      z-index: 2;
      pointer-events: none;
    }

    .map-fallback {
      margin: 0;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .map-credit {
      display: block;
      margin-top: 6px;
      text-align: right;
      color: var(--accent);
      font-size: 0.75rem;
      text-decoration: none;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .actions-row .btn { margin-top: 0; flex: 1; }

    .link-fallback {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.9rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .hidden { display: none !important; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: calc(12px + var(--safe-top));
      right: 12px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    dialog {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: 22px;
      max-width: 340px;
      width: calc(100% - 36px);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.72); }
    dialog h2 { margin: 0 0 8px; font-size: 1.15rem; }
    dialog p { margin: 0 0 18px; color: var(--muted); }
    dialog .actions-row { margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#111"/>
        <circle cx="12" cy="9" r="2.5" fill="#ff6a00"/>
      </svg>
    </div>
    <div>
      <h1>Parking Pin</h1>
      <p class="tagline">Create a pin and leave your car</p>
    </div>
  </header>

  <div id="view-main">
  <section class="card" aria-labelledby="park-heading">
    <h2 id="park-heading" class="hidden">Park</h2>
    <label for="note">Level / zone / note</label>
    <div class="chips" id="note-chips" role="group" aria-label="Quick notes">
      <button type="button" class="chip" data-note="P1" aria-pressed="false">P1</button>
      <button type="button" class="chip" data-note="P2" aria-pressed="false">P2</button>
      <button type="button" class="chip" data-note="P3" aria-pressed="false">P3</button>
      <button type="button" class="chip" data-note="Yellow" aria-pressed="false">Yellow</button>
      <button type="button" class="chip" data-note="Blue" aria-pressed="false">Blue</button>
      <button type="button" class="chip" data-note="Red" aria-pressed="false">Red</button>
      <button type="button" class="chip" data-note="Green" aria-pressed="false">Green</button>
      <button type="button" class="chip" data-note="Elevators" aria-pressed="false">Elevators</button>
      <button type="button" class="chip" data-note="Near exit" aria-pressed="false">Near exit</button>
    </div>
    <div class="chips" id="duration-chips" role="group" aria-label="Parking time">
      <button type="button" class="chip" data-minutes="30" aria-pressed="false">30 min</button>
      <button type="button" class="chip" data-minutes="60" aria-pressed="false">1 h</button>
      <button type="button" class="chip" data-minutes="120" aria-pressed="false">2 h</button>
      <button type="button" class="chip" data-minutes="180" aria-pressed="false">3 h</button>
    </div>
    <div class="note-row">
      <div class="photo-draft hidden" id="photo-draft">
        <img id="photo-preview" alt="">
        <button type="button" class="draft-remove" id="btn-photo-remove" aria-label="Remove photo">×</button>
      </div>
      <input
        id="note"
        type="text"
        maxlength="120"
        autocomplete="off"
        autocorrect="off"
        enterkeyhint="done"
        placeholder="P2 · Yellow · Elevators"
      />
      <button type="button" class="cam-btn" id="btn-camera" aria-label="Photo of the spot">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9.2 5.2 10.4 7h3.2l1.2-1.8H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7.2a2 2 0 0 1 2-2h3.2ZM12 9a4 4 0 1 0 .01 8.01A4 4 0 0 0 12 9Zm0 1.8a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4Z"/>
        </svg>
      </button>
    </div>
    <input class="file-input" id="photo-input" type="file" accept="image/*" capture="environment" tabindex="-1">
    <button type="button" class="btn btn-primary" id="btn-park">
      I’m parked
    </button>
  </section>

  <a class="pin-entry hidden" id="pin-entry" href="#pin">
    <img class="entry-thumb hidden" id="entry-thumb" alt="">
    <span class="pin-entry-body">
      <span class="pin-entry-note" id="entry-note">—</span>
      <span class="pin-entry-time" id="entry-time">—</span>
      <span class="pin-entry-countdown hidden" id="entry-countdown"></span>
    </span>
    <span class="pin-entry-chevron" aria-hidden="true">›</span>
  </a>
  </div>

  <div id="view-detail" class="hidden">
  <button type="button" class="back" id="btn-back">Back</button>
  <section class="card" aria-labelledby="pin-heading">
    <h2 id="pin-heading">Saved pin</h2>
    <div id="pin-panel">
      <div class="pin-meta">
        <div class="meta-row">
          <span class="meta-label">Saved</span>
          <span class="meta-value" id="pin-time">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Note</span>
          <span class="meta-value note-value" id="pin-note">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Coords</span>
          <span class="meta-value coords" id="pin-coords">—</span>
        </div>
        <div class="meta-row" id="accuracy-row">
          <span class="meta-label">Accuracy</span>
          <span class="meta-value" id="pin-accuracy">—</span>
        </div>
      </div>

      <button type="button" class="pin-photo hidden" id="pin-photo-btn" aria-label="Parking spot photo">
        <img id="pin-photo" alt="Parking spot">
      </button>

      <!-- Static map: OpenStreetMap tiles from tile.openstreetmap.org at zoom 18.
           No API key. staticmap.openstreetmap.de is discontinued. Marker is drawn here. -->
      <div class="map-block hidden" id="map-block">
        <a class="map-link" id="map-link" href="#">
          <span class="map-stage" id="map-stage"></span>
          <span class="map-dot" aria-hidden="true"></span>
        </a>
        <p class="map-fallback hidden" id="map-fallback">map unavailable</p>
        <a class="map-credit" id="map-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
      </div>

      <button type="button" class="btn btn-secondary hidden" id="btn-remind">Remind me</button>
      <button type="button" class="btn btn-maps" id="btn-find">
        Find car
      </button>
      <a class="link-fallback hidden" id="link-google" href="#" target="_blank" rel="noopener">Open in Google Maps</a>

      <button type="button" class="btn btn-danger" id="btn-clear">Clear pin</button>
    </div>
  </section>
  </div>

  <div class="lightbox hidden" id="lightbox">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="Parking spot">
  </div>

  <dialog id="clear-dialog">
    <h2>Clear parking pin?</h2>
    <p>This removes the saved location and note from this device.</p>
    <div class="actions-row">
      <button type="button" class="btn btn-secondary" id="btn-clear-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="btn-clear-confirm" style="background:var(--danger);color:#fff;">Clear</button>
    </div>
  </dialog>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "parking-pin-v1";
      var PHOTO_DB = "parking-pin-photos";
      var PHOTO_STORE = "photos";
      var PHOTO_KEY = "spot";
      var GEO_TIMEOUT_MS = 20000;
      var GEO_MAX_AGE_MS = 10000;
      var PHOTO_MAX_PX = 1280;
      var PHOTO_QUALITY = 0.7;

      var NOTE_SEP = " · ";
      var MAP_ZOOM = 18;
      var TILE_PX = 256;
      var mapToken = 0;

      var selectedMinutes = null;
      var pendingPhoto = null;
      var draftUrl = null;
      var shownUrl = null;
      var photoToken = 0;

      var el = {
        note: document.getElementById("note"),
        chips: document.getElementById("note-chips"),
        durationChips: document.getElementById("duration-chips"),
        btnPark: document.getElementById("btn-park"),
        btnCamera: document.getElementById("btn-camera"),
        photoInput: document.getElementById("photo-input"),
        photoDraft: document.getElementById("photo-draft"),
        photoPreview: document.getElementById("photo-preview"),
        btnPhotoRemove: document.getElementById("btn-photo-remove"),
        viewMain: document.getElementById("view-main"),
        viewDetail: document.getElementById("view-detail"),
        pinEntry: document.getElementById("pin-entry"),
        entryThumb: document.getElementById("entry-thumb"),
        entryNote: document.getElementById("entry-note"),
        entryTime: document.getElementById("entry-time"),
        entryCountdown: document.getElementById("entry-countdown"),
        btnBack: document.getElementById("btn-back"),
        pinTime: document.getElementById("pin-time"),
        pinNote: document.getElementById("pin-note"),
        pinCoords: document.getElementById("pin-coords"),
        pinAccuracy: document.getElementById("pin-accuracy"),
        accuracyRow: document.getElementById("accuracy-row"),
        mapBlock: document.getElementById("map-block"),
        mapLink: document.getElementById("map-link"),
        mapStage: document.getElementById("map-stage"),
        mapFallback: document.getElementById("map-fallback"),
        mapCredit: document.getElementById("map-credit"),
        pinPhotoBtn: document.getElementById("pin-photo-btn"),
        pinPhoto: document.getElementById("pin-photo"),
        btnFind: document.getElementById("btn-find"),
        btnRemind: document.getElementById("btn-remind"),
        linkGoogle: document.getElementById("link-google"),
        btnClear: document.getElementById("btn-clear"),
        dialog: document.getElementById("clear-dialog"),
        btnClearCancel: document.getElementById("btn-clear-cancel"),
        btnClearConfirm: document.getElementById("btn-clear-confirm"),
        lightbox: document.getElementById("lightbox"),
        lightboxImg: document.getElementById("lightbox-img"),
        lightboxClose: document.getElementById("lightbox-close")
      };

      function isIOS() {
        var ua = navigator.userAgent || "";
        return /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      function loadPin() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || typeof data !== "object") return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      function savePin(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function clearPinStorage() {
        localStorage.removeItem(STORAGE_KEY);
      }

      function formatTime(iso) {
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return iso || "—";
          return d.toLocaleString(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });
        } catch (e) {
          return iso || "—";
        }
      }

      function formatCoords(lat, lng) {
        if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) {
          return "No GPS (note only)";
        }
        return Number(lat).toFixed(5) + ", " + Number(lng).toFixed(5);
      }

      function setChipGroupDisabled(root, locked) {
        if (!root) return;
        var buttons = root.querySelectorAll(".chip");
        for (var i = 0; i < buttons.length; i++) buttons[i].disabled = locked;
      }

      function setComposerLocked(locked) {
        el.btnPark.disabled = locked;
        el.note.disabled = locked;
        el.btnCamera.disabled = locked;
        el.btnPhotoRemove.disabled = locked;
        setChipGroupDisabled(el.chips, locked);
        setChipGroupDisabled(el.durationChips, locked);
      }

      function escapeRegExp(s) {
        return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function noteHasChip(note, label) {
        if (!note || !label) return false;
        var re = new RegExp(
          "(^|[\\s·,.;])" + escapeRegExp(label) + "(?=$|[\\s·,.;])",
          "i"
        );
        return re.test(String(note));
      }

      function syncNoteChips() {
        if (!el.chips) return;
        var value = el.note.value || "";
        var buttons = el.chips.querySelectorAll(".chip");
        for (var i = 0; i < buttons.length; i++) {
          var label = buttons[i].getAttribute("data-note") || "";
          var on = noteHasChip(value, label);
          buttons[i].classList.toggle("is-on", on);
          buttons[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
      }

      function stripChipLabel(text, label) {
        var pattern = new RegExp(
          "(^|[\\s,.;]+)" + escapeRegExp(label) + "(?=$|[\\s,.;])",
          "i"
        );
        var next = String(text);
        var guard = 0;
        while (guard < 6 && pattern.test(next)) {
          next = next.replace(pattern, " ").replace(/\s{2,}/g, " ").trim();
          guard++;
        }
        return next.trim();
      }

      function removeChipLabel(note, label) {
        var parts = String(note).split(/\s*·\s*/);
        var kept = [];
        for (var i = 0; i < parts.length; i++) {
          var stripped = stripChipLabel(parts[i], label).replace(/^[,.;\s]+|[,.;\s]+$/g, "").trim();
          if (stripped) kept.push(stripped);
        }
        return kept.join(NOTE_SEP);
      }

      function toggleNoteChip(label) {
        if (!label || el.note.disabled) return;
        var current = el.note.value || "";
        if (noteHasChip(current, label)) {
          el.note.value = removeChipLabel(current, label);
          syncNoteChips();
          return;
        }
        var trimmed = current.trim();
        var next = trimmed ? trimmed + NOTE_SEP + label : label;
        var max = el.note.maxLength > 0 ? el.note.maxLength : 120;
        if (next.length > max) return;
        el.note.value = next;
        syncNoteChips();
      }

      function syncDurationChips(minutes) {
        if (!el.durationChips) return;
        var buttons = el.durationChips.querySelectorAll(".chip");
        for (var i = 0; i < buttons.length; i++) {
          var value = Number(buttons[i].getAttribute("data-minutes"));
          var on = minutes != null && value === minutes;
          buttons[i].classList.toggle("is-on", on);
          buttons[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
      }

      function toggleDurationChip(minutes) {
        if (el.note.disabled) return;
        if (!minutes) return;
        selectedMinutes = selectedMinutes === minutes ? null : minutes;
        syncDurationChips(selectedMinutes);
      }

      function minutesFromPin(pin) {
        if (!pin || !pin.endsAt || !pin.savedAt) return null;
        var ms = new Date(pin.endsAt).getTime() - new Date(pin.savedAt).getTime();
        if (!isFinite(ms) || ms <= 0) return null;
        var mins = Math.round(ms / 60000);
        if (mins === 30 || mins === 60 || mins === 120 || mins === 180) return mins;
        return null;
      }

      function formatCountdown(endsAt) {
        var end = new Date(endsAt).getTime();
        if (isNaN(end)) return null;
        var ms = end - Date.now();
        if (ms <= 0) return { text: "Expired", warn: true };
        var totalMin = Math.ceil(ms / 60000);
        var h = Math.floor(totalMin / 60);
        var m = totalMin % 60;
        var mm = (m < 10 ? "0" : "") + m;
        return { text: h + ":" + mm + " left", warn: ms < 10 * 60 * 1000 };
      }

      function updateCountdown() {
        var pin = loadPin();
        var countdown = pin && pin.endsAt ? formatCountdown(pin.endsAt) : null;
        if (!countdown) {
          el.entryCountdown.textContent = "";
          el.entryCountdown.classList.add("hidden");
          el.entryCountdown.classList.remove("is-warn");
          el.btnRemind.classList.add("hidden");
          return;
        }
        el.entryCountdown.textContent = countdown.text;
        el.entryCountdown.classList.remove("hidden");
        el.entryCountdown.classList.toggle("is-warn", countdown.warn);
        el.btnRemind.classList.toggle("hidden", !pin.endsAt);
        var label = el.pinEntry.getAttribute("data-base-label");
        if (label) el.pinEntry.setAttribute("aria-label", label + ", " + countdown.text);
      }

      function openPhotoDb() {
        return new Promise(function (resolve, reject) {
          if (!window.indexedDB) {
            reject(new Error("IndexedDB unavailable"));
            return;
          }
          var req = indexedDB.open(PHOTO_DB, 1);
          req.onupgradeneeded = function () {
            var db = req.result;
            if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
          };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }

      function savePhotoBlob(blob) {
        return openPhotoDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(PHOTO_STORE, "readwrite");
            tx.objectStore(PHOTO_STORE).put(blob, PHOTO_KEY);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        });
      }

      function loadPhotoBlob() {
        return openPhotoDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(PHOTO_STORE, "readonly");
            var req = tx.objectStore(PHOTO_STORE).get(PHOTO_KEY);
            req.onsuccess = function () { resolve(req.result || null); };
            req.onerror = function () { reject(req.error); };
          });
        });
      }

      function deletePhotoBlob() {
        return openPhotoDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(PHOTO_STORE, "readwrite");
            tx.objectStore(PHOTO_STORE).delete(PHOTO_KEY);
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        }).catch(function () { /* photo store is optional */ });
      }

      function hideShownPhoto() {
        photoToken++;
        if (shownUrl) URL.revokeObjectURL(shownUrl);
        shownUrl = null;
        el.entryThumb.classList.add("hidden");
        el.entryThumb.removeAttribute("src");
        el.pinPhotoBtn.classList.add("hidden");
        el.pinPhoto.removeAttribute("src");
        el.lightboxImg.removeAttribute("src");
        el.lightbox.classList.add("hidden");
      }

      function showStoredPhoto(pin) {
        var token = ++photoToken;
        if (!pin || !pin.hasPhoto) {
          hideShownPhoto();
          return;
        }
        loadPhotoBlob().then(function (blob) {
          if (token !== photoToken) return;
          if (!blob) {
            hideShownPhoto();
            return;
          }
          if (shownUrl) URL.revokeObjectURL(shownUrl);
          shownUrl = URL.createObjectURL(blob);
          el.entryThumb.src = shownUrl;
          el.entryThumb.classList.remove("hidden");
          el.pinPhoto.src = shownUrl;
          el.pinPhotoBtn.classList.remove("hidden");
          el.lightboxImg.src = shownUrl;
        }).catch(function () {
          if (token === photoToken) hideShownPhoto();
        });
      }

      function clearDraftPhoto() {
        pendingPhoto = null;
        if (draftUrl) URL.revokeObjectURL(draftUrl);
        draftUrl = null;
        el.photoPreview.removeAttribute("src");
        el.photoDraft.classList.add("hidden");

      function showDraftPhoto(blob) {
        pendingPhoto = blob;
        if (draftUrl) URL.revokeObjectURL(draftUrl);
        draftUrl = URL.createObjectURL(blob);
        el.photoPreview.src = draftUrl;
        el.photoDraft.classList.remove("hidden");
      }

      function readJpegSize(buffer) {
        var view = new DataView(buffer);
        if (view.byteLength < 4 || view.getUint16(0) !== 0xffd8) return null;
        var offset = 2;
        while (offset + 9 < view.byteLength) {
          var marker = view.getUint16(offset);
          if (marker === 0xffd9 || marker === 0xffda) break;
          var size = view.getUint16(offset + 2);
          if (marker >= 0xffc0 && marker <= 0xffc2) {
            return {
              height: view.getUint16(offset + 5),
              width: view.getUint16(offset + 7)
            };
          }
          if (size < 2) break;
          offset += 2 + size;
        }
        return null;
      }

      function readExifOrientation(buffer) {
        var view = new DataView(buffer);
        if (view.byteLength < 4 || view.getUint16(0) !== 0xffd8) return 1;
        var offset = 2;
        while (offset + 4 < view.byteLength) {
          var marker = view.getUint16(offset);
          if (marker === 0xffe1) {
            var exifStart = offset + 4;
            if (view.getUint32(exifStart) !== 0x45786966) return 1;
            var tiff = exifStart + 6;
            var little = view.getUint16(tiff) === 0x4949;
            var get16 = function (p) { return view.getUint16(p, little); };
            var get32 = function (p) { return view.getUint32(p, little); };
            var ifd = tiff + get32(tiff + 4);
            var entries = get16(ifd);
            for (var i = 0; i < entries; i++) {
              var entry = ifd + 2 + i * 12;
              if (get16(entry) === 0x0112) return get16(entry + 8) || 1;
            }
            return 1;
          }
          if ((marker & 0xff00) !== 0xff00) break;
          offset += 2 + view.getUint16(offset + 2);
        }
        return 1;
      }

      function drawOriented(source, width, height, orientation) {
        var maxSide = Math.max(width, height);
        var scale = maxSide > PHOTO_MAX_PX ? PHOTO_MAX_PX / maxSide : 1;
        var dw = Math.max(1, Math.round(width * scale));
        var dh = Math.max(1, Math.round(height * scale));
        var swap = orientation >= 5 && orientation <= 8;
        var canvas = document.createElement("canvas");
        canvas.width = swap ? dh : dw;
        canvas.height = swap ? dw : dh;
        var ctx = canvas.getContext("2d");
        switch (orientation) {
          case 2: ctx.translate(canvas.width, 0); ctx.scale(-1, 1); break;
          case 3: ctx.translate(canvas.width, canvas.height); ctx.rotate(Math.PI); break;
          case 4: ctx.translate(0, canvas.height); ctx.scale(1, -1); break;
          case 5: ctx.rotate(0.5 * Math.PI); ctx.scale(1, -1); break;
          case 6: ctx.rotate(0.5 * Math.PI); ctx.translate(0, -dh); break;
          case 7: ctx.rotate(0.5 * Math.PI); ctx.translate(dw, -dh); ctx.scale(-1, 1); break;
          case 8: ctx.rotate(-0.5 * Math.PI); ctx.translate(-dw, 0); break;
          default: break;
        }
        ctx.drawImage(source, 0, 0, dw, dh);
        return new Promise(function (resolve, reject) {
          canvas.toBlob(function (blob) {
            if (!blob) reject(new Error("jpeg"));
            else resolve(blob);
          }, "image/jpeg", PHOTO_QUALITY);
        });
      }

      function orientationToApply(orientation, stored, width, height) {
        var swaps = orientation >= 5 && orientation <= 8;
        var stillRaw = swaps && stored && width === stored.width && height === stored.height;
        return stillRaw ? orientation : 1;
      }

      function downscalePhoto(file) {
        return file.arrayBuffer().then(function (buffer) {
          var orientation = readExifOrientation(buffer);
          var stored = readJpegSize(buffer);
          function finish(source, width, height) {
            return drawOriented(source, width, height, orientationToApply(orientation, stored, width, height));
          }
          if (typeof createImageBitmap === "function") {
            return createImageBitmap(file, { imageOrientation: "from-image" }).then(function (bitmap) {
              var blobPromise = finish(bitmap, bitmap.width, bitmap.height);
              if (bitmap.close) bitmap.close();
              return blobPromise;
            }).catch(function () {
              return createImageBitmap(file).then(function (bitmap) {
                var blobPromise = finish(bitmap, bitmap.width, bitmap.height);
                if (bitmap.close) bitmap.close();
                return blobPromise;
              });
            });
          }
          return new Promise(function (resolve, reject) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () {
              URL.revokeObjectURL(url);
              finish(img, img.naturalWidth, img.naturalHeight).then(resolve, reject);
            };
            img.onerror = function () {
              URL.revokeObjectURL(url);
              reject(new Error("image"));
            };
            img.src = url;
          });
        });
      }

      function icsStamp(date) {
        function z(n) { return (n < 10 ? "0" : "") + n; }
        return date.getUTCFullYear() + z(date.getUTCMonth() + 1) + z(date.getUTCDate()) +
          "T" + z(date.getUTCHours()) + z(date.getUTCMinutes()) + z(date.getUTCSeconds()) + "Z";
      }

      function icsEscape(value) {
        return String(value || "")
          .replace(/\\/g, "\\\\")
          .replace(/\r\n|\n|\r/g, "\\n")
          .replace(/,/g, "\\,")
          .replace(/;/g, "\\;");
      }

      function buildIcs(pin) {
        var start = new Date(pin.savedAt);
        var end = new Date(pin.endsAt);
        var alarm = new Date(end.getTime() - 10 * 60 * 1000);
        var lines = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Parking Pin//EN",
          "CALSCALE:GREGORIAN",
          "METHOD:PUBLISH",
          "BEGIN:VEVENT",
          "UID:parking-" + end.getTime() + "@fambeho75.github.io",
          "DTSTAMP:" + icsStamp(new Date()),
          "DTSTART:" + icsStamp(start),
          "DTEND:" + icsStamp(end),
          "SUMMARY:Parking expires",
          "DESCRIPTION:" + icsEscape(pin.note || ""),
          "BEGIN:VALARM",
          "TRIGGER;VALUE=DATE-TIME:" + icsStamp(alarm),
          "ACTION:DISPLAY",
          "DESCRIPTION:Parking expires",
          "END:VALARM",
          "END:VEVENT",
          "END:VCALENDAR"
        ];
        return lines.join("\r\n") + "\r\n";
      }

      function openCalendar(pin) {
        if (!pin || !pin.endsAt) return;
        var blob = new Blob([buildIcs(pin)], { type: "text/calendar" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "parking-expires.ics";
        document.body.appendChild(link);
        link.click();
        setTimeout(function () {
          URL.revokeObjectURL(url);
          link.remove();
        }, 1500);
      }

      function mapsUrls(lat, lng) {
        var dest = encodeURIComponent(lat + "," + lng);
        return {
          apple: "https://maps.apple.com/?daddr=" + dest,
          google: "https://www.google.com/maps/dir/?api=1&destination=" + dest
        };
      }

      function directionsUrl(lat, lng) {
        var urls = mapsUrls(lat, lng);
        return isIOS() ? urls.apple : urls.google;
      }

      function hideMap() {
        mapToken++;
        if (!el.mapBlock) return;
        el.mapBlock.classList.add("hidden");
        el.mapLink.classList.add("hidden");
        el.mapFallback.classList.add("hidden");
        el.mapCredit.classList.add("hidden");
        el.mapStage.innerHTML = "";
        el.mapLink.removeAttribute("href");
      }

      function showMapError() {
        if (!el.mapBlock) return;
        el.mapBlock.classList.remove("hidden");
        el.mapLink.classList.add("hidden");
        el.mapCredit.classList.add("hidden");
        el.mapStage.innerHTML = "";
        el.mapFallback.classList.remove("hidden");
      }

      function showStaticMap(lat, lng, href) {
        var token = ++mapToken;
        el.mapBlock.classList.remove("hidden");
        el.mapLink.classList.remove("hidden");
        el.mapCredit.classList.remove("hidden");
        el.mapFallback.classList.add("hidden");
        el.mapLink.href = href;
        el.mapLink.setAttribute("aria-label", "Map of saved pin. Open directions.");
        el.mapStage.innerHTML = "";
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            if (token !== mapToken) return;
            paintStaticMap(token, lat, lng);
          });
        });
      }

      function paintStaticMap(token, lat, lng) {
        var zoom = MAP_ZOOM;
        var n = Math.pow(2, zoom);
        var fx = (Number(lng) + 180) / 360 * n;
        var latClamped = Math.max(-85.05112878, Math.min(85.05112878, Number(lat)));
        var latRad = latClamped * Math.PI / 180;
        var fy = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
        var width = el.mapLink.clientWidth || 320;
        var height = el.mapLink.clientHeight || 180;
        var originX = fx * TILE_PX - width / 2;
        var originY = fy * TILE_PX - height / 2;
        var minX = Math.floor(originX / TILE_PX);
        var maxX = Math.floor((originX + width - 1) / TILE_PX);
        var minY = Math.floor(originY / TILE_PX);
        var maxY = Math.floor((originY + height - 1) / TILE_PX);
        var centerTileX = Math.floor(fx);
        var centerTileY = Math.floor(fy);
        var pending = 0;
        var centerOk = false;
        var painting = true;

        function settle() {
          if (painting || token !== mapToken) return;
          if (pending === 0 && !centerOk) showMapError();
        }

        for (var ty = minY; ty <= maxY; ty++) {
          if (ty < 0 || ty >= n) continue;
          for (var tx = minX; tx <= maxX; tx++) {
            var wrappedX = ((tx % n) + n) % n;
            var isCenter = tx === centerTileX && ty === centerTileY;
            var img = document.createElement("img");
            img.className = "map-tile";
            img.alt = "";
            img.width = TILE_PX;
            img.height = TILE_PX;
            img.draggable = false;
            img.style.left = (tx * TILE_PX - originX) + "px";
            img.style.top = (ty * TILE_PX - originY) + "px";
            img.onload = function () {
              if (token !== mapToken) return;
              if (this.getAttribute("data-center") === "1") centerOk = true;
              pending--;
              settle();
            };
            img.onerror = function () {
              if (token !== mapToken) return;
              this.remove();
              pending--;
              settle();
            };
            if (isCenter) img.setAttribute("data-center", "1");
            pending++;
            el.mapStage.appendChild(img);
            img.src = "https://tile.openstreetmap.org/" + zoom + "/" + wrappedX + "/" + ty + ".png";
          }
        }

        painting = false;
        if (pending === 0) showMapError();
        else settle();
      }

      function isDetailHash() {
        return location.hash === "#pin";
      }

      function render() {
        var pin = loadPin();
        if (isDetailHash() && !pin) {
          history.replaceState(null, "", location.pathname + location.search);
        }
        var detail = isDetailHash() && !!pin;

        el.viewMain.classList.toggle("hidden", detail);
        el.viewDetail.classList.toggle("hidden", !detail);

        setComposerLocked(!!pin);

        if (!pin) {
          el.pinEntry.classList.add("hidden");
          el.linkGoogle.classList.add("hidden");
          hideMap();
          hideShownPhoto();
          syncNoteChips();
          syncDurationChips(selectedMinutes);
          if (pendingPhoto) showDraftPhoto(pendingPhoto);
          updateCountdown();
          return;
        }

        el.pinEntry.classList.remove("hidden");
        el.photoDraft.classList.add("hidden");

        var noteText = (pin.note && String(pin.note).trim()) || "No note";
        var timeText = formatTime(pin.savedAt);
        el.entryNote.textContent = noteText;
        el.entryTime.textContent = timeText;
        el.pinEntry.setAttribute("data-base-label", "Saved pin, " + noteText + ", " + timeText);
        el.pinEntry.setAttribute("aria-label", "Saved pin, " + noteText + ", " + timeText);
        el.pinTime.textContent = timeText;
        el.pinNote.textContent = noteText;
        el.pinCoords.textContent = formatCoords(pin.lat, pin.lng);

        if (pin.accuracy != null && !isNaN(pin.accuracy)) {
          el.accuracyRow.classList.remove("hidden");
          el.pinAccuracy.textContent = "±" + Math.round(pin.accuracy) + " m";
        } else {
          el.accuracyRow.classList.add("hidden");
        }

        var hasGps = pin.lat != null && pin.lng != null && !isNaN(pin.lat) && !isNaN(pin.lng);
        el.btnFind.disabled = !hasGps;
        if (hasGps) {
          var urls = mapsUrls(pin.lat, pin.lng);
          el.btnFind.dataset.apple = urls.apple;
          el.btnFind.dataset.google = urls.google;
          el.linkGoogle.href = urls.google;
          el.linkGoogle.classList.toggle("hidden", !isIOS());
          if (detail) showStaticMap(pin.lat, pin.lng, directionsUrl(pin.lat, pin.lng));
          else hideMap();
        } else {
          el.linkGoogle.classList.add("hidden");
          hideMap();
        }

        if (pin.note && !el.note.value) {
          el.note.value = pin.note;
        }
        syncNoteChips();
        syncDurationChips(minutesFromPin(pin));
        showStoredPhoto(pin);
        updateCountdown();
      }

      function getPosition() {
        return new Promise(function (resolve, reject) {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation is not supported in this browser."));
            return;
          }
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: GEO_TIMEOUT_MS,
            maximumAge: GEO_MAX_AGE_MS
          });
        });
      }

      function isSecureContextOk() {
        return window.isSecureContext === true ||
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1";
      }

      async function park() {
        if (loadPin() || el.btnPark.disabled) return;
        el.btnPark.disabled = true;

        var note = (el.note.value || "").trim();
        var minutes = selectedMinutes;
        var photoBlob = pendingPhoto;
        var saved = new Date();
        var pin = {
          lat: null,
          lng: null,
          accuracy: null,
          note: note,
          savedAt: saved.toISOString()
        };
        if (minutes) {
          pin.endsAt = new Date(saved.getTime() + minutes * 60000).toISOString();
        }

        if (isSecureContextOk()) {
          try {
            var pos = await getPosition();
            pin.lat = pos.coords.latitude;
            pin.lng = pos.coords.longitude;
            pin.accuracy = pos.coords.accuracy;
          } catch (err) {
            /* save the note without coordinates */
          }
        }

        if (loadPin()) {
          render();
          return;
        }

        var stored = photoBlob
          ? savePhotoBlob(photoBlob).then(function () { pin.hasPhoto = true; })
          : deletePhotoBlob();
        stored.then(function () {
          if (loadPin()) {
            render();
            return;
          }
          savePin(pin);
          clearDraftPhoto();
          render();
        }).catch(function () {
          if (loadPin()) {
            render();
            return;
          }
          delete pin.hasPhoto;
          savePin(pin);
          clearDraftPhoto();
          render();
        });
      }

      function findCar() {
        var pin = loadPin();
        if (!pin || pin.lat == null || pin.lng == null) return;
        window.location.href = directionsUrl(pin.lat, pin.lng);
      }

      function wipePin() {
        clearPinStorage();
        selectedMinutes = null;
        clearDraftPhoto();
        hideShownPhoto();
        return deletePhotoBlob();
      }

      function openClearDialog() {
        if (typeof el.dialog.showModal === "function") {
          el.dialog.showModal();
        } else if (window.confirm("Clear parking pin?")) {
          wipePin().then(function () {
            if (location.hash) location.hash = "";
            render();
          });
        }
      }

      function confirmClear() {
        el.dialog.close();
        wipePin().then(function () {
          if (location.hash) location.hash = "";
          render();
        });
      }

      if (el.chips) {
        el.chips.addEventListener("click", function (e) {
          var btn = e.target && e.target.closest ? e.target.closest(".chip") : null;
          if (!btn || !el.chips.contains(btn)) return;
          toggleNoteChip(btn.getAttribute("data-note"));
        });
      }

      if (el.durationChips) {
        el.durationChips.addEventListener("click", function (e) {
          var btn = e.target && e.target.closest ? e.target.closest(".chip") : null;
          if (!btn || !el.durationChips.contains(btn)) return;
          toggleDurationChip(Number(btn.getAttribute("data-minutes")));
        });
      }

      el.btnCamera.addEventListener("click", function () {
        if (el.btnCamera.disabled) return;
        el.photoInput.click();
      });

      el.photoInput.addEventListener("change", function () {
        var file = el.photoInput.files && el.photoInput.files[0];
        el.photoInput.value = "";
        if (!file || el.btnCamera.disabled) return;
        downscalePhoto(file).then(showDraftPhoto).catch(function () { /* ignore unreadable image */ });
      });

      el.btnPhotoRemove.addEventListener("click", function () {
        if (el.btnPhotoRemove.disabled) return;
        clearDraftPhoto();
      });

      el.pinPhotoBtn.addEventListener("click", function () {
        if (!shownUrl) return;
        el.lightbox.classList.remove("hidden");
      });

      function closeLightbox() {
        el.lightbox.classList.add("hidden");
      }

      el.lightboxClose.addEventListener("click", closeLightbox);
      el.lightbox.addEventListener("click", function (e) {
        if (e.target === el.lightbox || e.target === el.lightboxImg) closeLightbox();
      });

      el.btnRemind.addEventListener("click", function () {
        openCalendar(loadPin());
      });

      el.note.addEventListener("input", syncNoteChips);

      el.btnBack.addEventListener("click", function () {
        location.hash = "";
      });

      window.addEventListener("hashchange", render);

      el.btnPark.addEventListener("click", park);
      el.btnFind.addEventListener("click", findCar);
      el.btnClear.addEventListener("click", openClearDialog);
      el.btnClearCancel.addEventListener("click", function () { el.dialog.close(); });
      el.btnClearConfirm.addEventListener("click", confirmClear);

      el.note.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          el.note.blur();
          park();
        }
      });

      render();
      setInterval(updateCountdown, 30000);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") updateCountdown();
      });

      if ("serviceWorker" in navigator) {
        var refreshing = false;
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hadController) {
            hadController = true;
            return;
          }
          if (refreshing) return;
          refreshing = true;
          location.reload();
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(function (reg) {
            function checkForUpdate() {
              reg.update().catch(function () { /* optional */ });
            }
            checkForUpdate();
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") checkForUpdate();
            });
          }).catch(function () { /* optional */ });
        });
      }
    })();
  </script>
</body>
</html>
